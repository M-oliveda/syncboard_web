# Deploy Production Workflow
#
# Manually dispatched deploy to the standing `syncboard-web` Cloud Run service in the
# Production GCP project. Production has its own dedicated GCP project and secrets
# (see MASTERPLAN.md §12.0/§12.4), pulled from the `production` GitHub Environment
# below. Builds the Dockerfile's `production` target (public, no Basic Auth) — see
# MASTERPLAN.md §12.5.
#
# Unlike Development/Staging, this workflow is never chained from ci.yml — dispatching
# it manually bypasses ci.yml's own triggers entirely, so the `test` job below reruns
# the full lint/type-check/build/coverage/e2e gate (by reusing ci.yml as a
# workflow_call) on the dispatched ref before `deploy-prod` is allowed to run.

name: Deploy Production

on:
  workflow_dispatch:

env:
  REGION: us-central1
  SERVICE: syncboard-web
  IMAGE_REPOSITORY: docker.io/moliveda/syncboard-web

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  deploy-prod:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image (Public, no auth)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
            VITE_SOCKET_URL=${{ secrets.VITE_SOCKET_URL }}
            VITE_APP_ENV=production
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}:prod-${{ github.sha }}

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          image: ${{ env.IMAGE_REPOSITORY }}:prod-${{ github.sha }}
          flags: "--allow-unauthenticated --port=80"
